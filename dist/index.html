<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Schedule & Tracker</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schedule" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Theme color: adapts to light/dark -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)" />
    <script type="module" crossorigin src="/assets/index-C1aDVqOc.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DUvO7I2r.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply dark class before paint to avoid flash
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        document.documentElement.classList.toggle('dark', e.matches);
      });
    </script>
  </body>
</html>
